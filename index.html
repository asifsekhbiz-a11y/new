<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyGlot Code Studio - HTML, CSS, JS, C & Python Hub</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <div class="logo">
            <i class="fa-solid fa-code"></i>
            <span>PolyGlot Studio</span>
        </div>
        <div class="nav-links">
            <button class="btn btn-primary" id="runProjectBtn"><i class="fa-solid fa-play"></i> Run Project</button>
        </div>
    </header>

    <!-- Main Dashboard Layout -->
    <main class="dashboard">
        <!-- Sidebar Navigation for Languages -->
        <aside class="sidebar">
            <h3>Languages</h3>
            <ul>
                <li class="tab-btn active" data-target="html-panel"><i class="fa-brands fa-html5" style="color: #e34f26;"></i> HTML</li>
                <li class="tab-btn" data-target="css-panel"><i class="fa-brands fa-css3-alt" style="color: #1572b6;"></i> CSS</li>
                <li class="tab-btn" data-target="js-panel"><i class="fa-brands fa-js" style="color: #f7df1e;"></i> JavaScript</li>
                <li class="tab-btn" data-target="c-panel"><i class="fa-solid fa-c" style="color: #00599c;"></i> C Program</li>
                <li class="tab-btn" data-target="python-panel"><i class="fa-brands fa-python" style="color: #3776ab;"></i> Python</li>
            </ul>
        </aside>

        <!-- Editor Work Area -->
        <section class="editor-container">
            <!-- HTML Panel -->
            <div class="code-panel active" id="html-panel">
                <div class="panel-header"><span>index.html</span></div>
                <textarea class="code-editor" placeholder="Write your HTML code here...">
<div class="card">
    <h1>Welcome to PolyGlot Studio</h1>
    <p>Frontend meets C & Python logic!</p>
    <button id="clickMe">Click Me</button>
    <div id="output-box"></div>
</div>
                </textarea>
            </div>

            <!-- CSS Panel -->
            <div class="code-panel" id="css-panel">
                <div class="panel-header"><span>style.css</span></div>
                <textarea class="code-editor" placeholder="Write your CSS code here...">
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.card {
    background: #1e293b;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    text-align: center;
    max-width: 400px;
}
h1 { color: #38bdf8; font-size: 24px; }
button {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    margin-top: 15px;
}
button:hover { background: #2563eb; }
#output-box { margin-top: 15px; font-weight: bold; color: #4ade80; }
                </textarea>
            </div>

            <!-- JavaScript Panel -->
            <div class="code-panel" id="js-panel">
                <div class="panel-header"><span>script.js</span></div>
                <textarea class="code-editor" placeholder="Write your JavaScript code here...">
document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('clickMe');
    const output = document.getElementById('output-box');
    
    btn.addEventListener('click', () => {
        output.textContent = "Hello from JavaScript! Frontend is active.";
    });
});
                </textarea>
            </div>

            <!-- C Panel (Sample Code View) -->
            <div class="code-panel" id="c-panel">
                <div class="panel-header"><span>main.c (Backend Core)</span></div>
                <textarea class="code-editor" readonly>
#include <stdio.h>

// C Logic for High-Performance Computation
int main() {
    printf("=== C Program Execution ===\n");
    int arr[] = {10, 20, 30, 40, 50};
    int sum = 0;
    
    for(int i = 0; i < 5; i++) {
        sum += arr[i];
    }
    
    printf("Calculated Sum from C Backend: %d\n", sum);
    return 0;
}
                </textarea>
            </div>

            <!-- Python Panel (Sample Code View) -->
            <div class="code-panel" id="python-panel">
                <div class="panel-header"><span>logic.py (Data & AI Layer)</span></div>
                <textarea class="code-editor" readonly>
# Python Logic for Data Processing / API
import json

def process_data():
    data = {
        "status": "success",
        "message": "Processed via Python Backend",
        "values": [2, 4, 6, 8, 10]
    }
    print(json.dumps(data, indent=2))

if __name__ == "__main__":
    process_data()
                </textarea>
            </div>
        </section>

        <!-- Live Preview / Console Output -->
        <section class="preview-container">
            <div class="panel-header"><span>Live Preview & Output Console</span></div>
            <div class="preview-box" id="previewBox">
                <!-- Dynamic Live Output Render Hobe -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
